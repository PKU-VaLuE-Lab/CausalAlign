[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalalign-paper"
version = "1.0.0"
description = "Reproducible three-stage CausalAlign training for Wan2.2"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "safetensors>=0.4",
]

[project.optional-dependencies]
wan = ["diffusers>=0.35.1,<0.40", "transformers>=4.49", "accelerate>=1.2"]
wam = [
  "av>=12",
  "einops>=0.8",
  "ftfy>=6.2",
  "huggingface-hub>=0.28",
  "hydra-core>=1.3",
  "modelscope>=1.20",
  "omegaconf>=2.3",
  "pandas>=2.0",
  "pyarrow>=15",
  "rich>=13",
  "scipy>=1.10",
  "sentencepiece>=0.2",
  "tokenizers>=0.20",
  "tqdm>=4.66",
  "transformers>=4.49",
  "wandb>=0.18",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["causalalign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

