_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_max_len: 512
load_text_encoder: false
proprio_dim: 80
redirect_common_files: false
mot_checkpoint_mixed_attn: false
action_dit_pretrained_path: ${oc.env:WAM_ACTION_BACKBONE}
skip_dit_load_from_pretrain: false
video_dit_config:
  has_image_input: false
  patch_size:
  - 1
  - 2
  - 2
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: false
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: 80
  action_group_causal_mask_mode: group_diagonal
action_dit_config:
  action_dim: 80
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: false
video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
loss:
  lambda_action: 1.0
  lambda_video: 1.0
video_dit_lora_checkpoint: ${oc.env:WAM_VIDEO_LORA}
action_dit_lora_checkpoint: null
